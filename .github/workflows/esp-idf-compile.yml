name: ESP-IDF compile/link

on:
  push:
    branches: [main]
    paths:
      - 'components/**'
      - 'firmware/**'
      - 'tests/espidf_probe/**'
      - 'tests/espidf_linux_probe/**'
      - 'tests/espidf_dns_probe/**'
      - '.github/workflows/esp-idf-compile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'components/**'
      - 'firmware/**'
      - 'tests/espidf_probe/**'
      - 'tests/espidf_linux_probe/**'
      - 'tests/espidf_dns_probe/**'
      - '.github/workflows/esp-idf-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-dns:
    name: Linux / A7b zero-egress DNS lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: espressif/idf:v6.0.2
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify pinned SDK and build isolated DNS binary (no execution)
        run: |
          . "$IDF_PATH/export.sh"
          test "$(idf.py --version)" = "ESP-IDF v6.0.2"
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = "7101770dc6db2667b3c477cc31365dd1acd6db4e"
          test "$(git -C "$IDF_PATH/components/lwip/lwip" rev-parse HEAD)" = "fd432e4ee2cfb7f7f1c7eb7227e0173412e7b84e"
          echo "A7B tested checkout: $GITHUB_SHA"
          idf.py --preview -C tests/espidf_dns_probe -B "$GITHUB_WORKSPACE/build-a7b" -D IDF_TARGET=linux build
      - name: Inspect generated config and prove interception BEFORE resolver execution
        run: |
          grep -qx 'CONFIG_IDF_TARGET_LINUX=y' build-a7b/sdkconfig
          grep -qx 'CONFIG_LWIP_ENABLE=y' build-a7b/sdkconfig
          python tests/espidf_probe/report_config.py build-a7b/sdkconfig --cell 'linux / A7b DNS'
          python -B tests/espidf_dns_probe/verify_and_run.py build-a7b

  linux-callback:
    name: Linux / A6b offline SDK callback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: espressif/idf:v6.0.2
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify pinned SDK and build Linux host probe
        run: |
          . "$IDF_PATH/export.sh"
          test "$(idf.py --version)" = "ESP-IDF v6.0.2"
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = "7101770dc6db2667b3c477cc31365dd1acd6db4e"
          test "$(git -C "$IDF_PATH/components/lwip/lwip" rev-parse HEAD)" = "fd432e4ee2cfb7f7f1c7eb7227e0173412e7b84e"
          echo "A6B tested checkout: $GITHUB_SHA"
          idf.py --preview -C tests/espidf_linux_probe -B "$GITHUB_WORKSPACE/build-a6b" -D IDF_TARGET=linux build
      - name: Read generated Linux configuration
        run: |
          grep -E '^(CONFIG_IDF_TARGET(_LINUX)?=|CONFIG_LWIP_ENABLE=|CONFIG_FREERTOS_SMP=|# CONFIG_FREERTOS_SMP is not set)' build-a6b/sdkconfig
          grep -qx 'CONFIG_IDF_TARGET_LINUX=y' build-a6b/sdkconfig
          grep -qx 'CONFIG_LWIP_ENABLE=y' build-a6b/sdkconfig
          python tests/espidf_probe/report_config.py build-a6b/sdkconfig --cell 'linux / A6b offline SDK'
          nm build-a6b/wfrac_a6b_linux.elf | grep -E ' [Tt] (tcpip_try_callback|tcpip_thread)$'
      - name: Run offline Linux SDK callback and deferred-fence tests
        run: timeout --signal=KILL 20s build-a6b/wfrac_a6b_linux.elf

  compile:
    name: ${{ matrix.target }} / ${{ matrix.firmware }} / ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: espressif/idf:v6.0.2
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [esp32c6, esp32c3]
        firmware: [firmware/idf_compile_smoke, firmware/wfrac_bootstrap_probe]
        variant: [default]
        include:
          - target: esp32c6
            firmware: firmware/wfrac_bootstrap_probe
            variant: webui
          - target: esp32c3
            firmware: firmware/wfrac_bootstrap_probe
            variant: webui
    defaults:
      run:
        shell: bash
    env:
      IDF_TARGET: ${{ matrix.target }}
      FIRMWARE: ${{ matrix.firmware }}
      VARIANT: ${{ matrix.variant }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # GitHub container steps do not rely on the image's normal entrypoint.
      - name: Verify ESP-IDF provisioning
        run: |
          . "$IDF_PATH/export.sh"
          test "$(idf.py --version)" = "ESP-IDF v6.0.2"
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = "7101770dc6db2667b3c477cc31365dd1acd6db4e"
          test "$(git -C "$IDF_PATH/components/lwip/lwip" rev-parse HEAD)" = "fd432e4ee2cfb7f7f1c7eb7227e0173412e7b84e"
          test -f "$FIRMWARE/CMakeLists.txt"
          echo "Provisioned ESP-IDF v6.0.2: $IDF_TARGET / $FIRMWARE"

      - name: Compile and link (no firmware execution)
        run: |
          . "$IDF_PATH/export.sh"
          extra=()
          if [ "$VARIANT" = webui ]; then
            extra=(-D 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;webui.defaults')
          fi
          idf.py -C "$FIRMWARE" -B build-ci -D "IDF_TARGET=$IDF_TARGET" "${extra[@]}" build
          if [ "$FIRMWARE" = "firmware/wfrac_bootstrap_probe" ]; then
            test -r "$GITHUB_WORKSPACE/build-ci/sdkconfig"
            ! grep -qx 'CONFIG_WFRAC_PROBE_ENABLED=y' "$GITHUB_WORKSPACE/build-ci/sdkconfig"
            if [ "$VARIANT" = webui ]; then
              grep -qx 'CONFIG_WFRAC_PROBE_WEBUI_ENABLED=y' "$GITHUB_WORKSPACE/build-ci/sdkconfig"
              grep -qx 'CONFIG_WFRAC_PROBE_AP_PASSWORD="compile-only-fixture"' "$GITHUB_WORKSPACE/build-ci/sdkconfig"
            else
              ! grep -qx 'CONFIG_WFRAC_PROBE_WEBUI_ENABLED=y' "$GITHUB_WORKSPACE/build-ci/sdkconfig"
            fi
          fi

      - name: A5 generated firmware configuration (allowlist only)
        run: |
          . "$IDF_PATH/export.sh"
          python tests/espidf_probe/report_config.py "$GITHUB_WORKSPACE/build-ci/sdkconfig" \
            --cell "$IDF_TARGET / $FIRMWARE / $VARIANT"

      - name: A5 isolated SDK callback-fence compile/link (no execution)
        run: |
          . "$IDF_PATH/export.sh"
          mkdir -p "$GITHUB_WORKSPACE/build-a5"
          cp "$GITHUB_WORKSPACE/build-ci/sdkconfig" "$GITHUB_WORKSPACE/build-a5/sdkconfig"
          idf.py -C tests/espidf_probe -B "$GITHUB_WORKSPACE/build-a5" -D "IDF_TARGET=$IDF_TARGET" build
          python tests/espidf_probe/report_config.py "$GITHUB_WORKSPACE/build-a5/sdkconfig" \
            --cell "$IDF_TARGET / isolated-probe / $VARIANT" \
            --compare "$GITHUB_WORKSPACE/build-ci/sdkconfig"
          riscv32-esp-elf-nm "$GITHUB_WORKSPACE/build-a5/wfrac_a5_link_only.elf" | \
            grep -E ' [Tt] (tcpip_try_callback|dns_gethostbyname_addrtype)$'
          echo 'A5 tier=LINK_ONLY; SDK callback execution=NOT_RUN; owner/reclaim=UNPROVEN'
