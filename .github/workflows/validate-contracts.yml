name: Validate WF-RAC contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: python -m py_compile tools/validate_contracts.py

      - name: Validate contract
        run: python tools/validate_contracts.py

      - name: Run host tests
        run: python -m unittest tests.host.test_validate_contracts

      - name: Run D1 offline deadline contract tests (pinned SDK parser)
        run: python -B tests/host_cpp/run_deadline_d1.py --fetch-pinned-parser

      - name: Run A3 offline DNS callback-owner tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          tests/host_cpp/test_deadline_a3.cpp
          -o deadline-a3-tests && ./deadline-a3-tests

      - name: Run offline diagnostic form tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -Ifirmware/wfrac_bootstrap_probe/main
          firmware/wfrac_bootstrap_probe/main/diagnostic_form.cpp
          tests/host_cpp/test_diagnostic_form.cpp
          -o diagnostic-form-tests && ./diagnostic-form-tests

      - name: Run C++ protocol core tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -Icomponents/wfrac_protocol/include
          components/wfrac_protocol/src/crc16.cpp
          components/wfrac_protocol/src/aircon_frame.cpp
          components/wfrac_protocol/src/aircon_state.cpp
          components/wfrac_protocol/src/capabilities.cpp
          components/wfrac_protocol/src/operation_data.cpp
          components/wfrac_protocol/src/aircon_block.cpp
          components/wfrac_protocol/src/base64.cpp
          components/wfrac_protocol/src/aircon_stat.cpp
          tests/host_cpp/test_protocol_core.cpp
          tests/host_cpp/test_operation_values.cpp
          -o protocol-core-tests && ./protocol-core-tests

      - name: Run C++ device model tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -Icomponents/wfrac_protocol/include
          -Icomponents/wfrac_device_model/include
          components/wfrac_protocol/src/crc16.cpp
          components/wfrac_protocol/src/aircon_frame.cpp
          components/wfrac_protocol/src/aircon_state.cpp
          components/wfrac_protocol/src/capabilities.cpp
          components/wfrac_protocol/src/operation_data.cpp
          components/wfrac_protocol/src/aircon_block.cpp
          components/wfrac_protocol/src/aircon_stat.cpp
          components/wfrac_device_model/src/protocol_mapping.cpp
          components/wfrac_device_model/src/device_state.cpp
          components/wfrac_device_model/src/protocol_command_mapping.cpp
          components/wfrac_device_model/src/protocol_request_mapping.cpp
          components/wfrac_device_model/src/protocol_observation.cpp
          tests/host_cpp/test_device_model.cpp
          -o device-model-tests && ./device-model-tests

      - name: Run C++ Matter mapping tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -Icomponents/wfrac_device_model/include
          -Icomponents/wfrac_matter_adapter/include
          components/wfrac_matter_adapter/src/rac_mapping.cpp
          tests/host_cpp/test_matter_mapping.cpp
          -o matter-mapping-tests && ./matter-mapping-tests

      - name: Run C++ persistence tests (fake storage only)
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -Icomponents/wfrac_persistence/include
          -Icomponents/wfrac_protocol/include
          -Icomponents/wfrac_transport/include
          components/wfrac_protocol/src/crc16.cpp
          components/wfrac_persistence/src/records.cpp
          tests/host_cpp/test_persistence.cpp
          -o persistence-tests && ./persistence-tests

      - name: Run C++ transport tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -Icomponents/wfrac_transport/include
          components/wfrac_transport/src/scheme_policy.cpp
          tests/host_cpp/test_transport.cpp
          -o transport-tests && ./transport-tests

      - name: Run C++ API tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -Icomponents/wfrac_protocol/include
          -Icomponents/wfrac_api/include
          components/wfrac_protocol/src/crc16.cpp
          components/wfrac_protocol/src/aircon_frame.cpp
          components/wfrac_protocol/src/base64.cpp
          components/wfrac_api/src/api_request.cpp
          tests/host_cpp/test_api.cpp
          -o api-tests && ./api-tests

      - name: Run C++ API response tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -Icomponents/wfrac_protocol/include -Icomponents/wfrac_api/include
          components/wfrac_protocol/src/crc16.cpp
          components/wfrac_protocol/src/aircon_frame.cpp
          components/wfrac_protocol/src/base64.cpp
          components/wfrac_api/src/api_response.cpp tests/host_cpp/test_api_response.cpp
          -o api-response-tests && ./api-response-tests

      - name: Run C++ read path tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -Icomponents/wfrac_protocol/include
          -Icomponents/wfrac_api/include
          -Icomponents/wfrac_device_model/include
          components/wfrac_protocol/src/crc16.cpp
          components/wfrac_protocol/src/base64.cpp
          components/wfrac_protocol/src/aircon_frame.cpp
          components/wfrac_protocol/src/aircon_state.cpp
          components/wfrac_api/src/api_response.cpp
          components/wfrac_device_model/src/protocol_mapping.cpp
          components/wfrac_device_model/src/device_state.cpp
          components/wfrac_device_model/src/protocol_observation.cpp
          tests/host_cpp/test_read_path.cpp
          -o read-path-tests && ./read-path-tests

      - name: Run C++ Client tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -Icomponents/wfrac_protocol/include
          -Icomponents/wfrac_api/include
          -Icomponents/wfrac_transport/include
          -Icomponents/wfrac_client/include
          components/wfrac_protocol/src/crc16.cpp
          components/wfrac_protocol/src/aircon_frame.cpp
          components/wfrac_protocol/src/base64.cpp
          components/wfrac_api/src/api_request.cpp
          components/wfrac_transport/src/scheme_policy.cpp
          components/wfrac_client/src/request_executor.cpp
          tests/host_cpp/test_client.cpp
          -o client-tests && ./client-tests

      - name: Run C++ control verification tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -Icomponents/wfrac_protocol/include
          -Icomponents/wfrac_api/include
          -Icomponents/wfrac_transport/include
          -Icomponents/wfrac_device_model/include
          -Icomponents/wfrac_client/include
          components/wfrac_protocol/src/crc16.cpp
          components/wfrac_protocol/src/aircon_frame.cpp
          components/wfrac_protocol/src/aircon_state.cpp
          components/wfrac_protocol/src/base64.cpp
          components/wfrac_api/src/api_request.cpp
          components/wfrac_api/src/api_response.cpp
          components/wfrac_transport/src/scheme_policy.cpp
          components/wfrac_device_model/src/protocol_mapping.cpp
          components/wfrac_device_model/src/device_state.cpp
          components/wfrac_device_model/src/protocol_observation.cpp
          components/wfrac_client/src/request_executor.cpp
          components/wfrac_client/src/control_verification.cpp
          tests/host_cpp/test_control_verification.cpp
          -o control-verification-tests && ./control-verification-tests

      - name: Run C++ runtime orchestration tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -Icomponents/wfrac_protocol/include
          -Icomponents/wfrac_api/include
          -Icomponents/wfrac_transport/include
          -Icomponents/wfrac_device_model/include
          -Icomponents/wfrac_client/include
          components/wfrac_protocol/src/crc16.cpp
          components/wfrac_protocol/src/aircon_frame.cpp
          components/wfrac_protocol/src/aircon_state.cpp
          components/wfrac_protocol/src/aircon_block.cpp
          components/wfrac_protocol/src/aircon_stat.cpp
          components/wfrac_protocol/src/base64.cpp
          components/wfrac_protocol/src/operation_data.cpp
          components/wfrac_api/src/api_request.cpp
          components/wfrac_api/src/api_response.cpp
          components/wfrac_transport/src/scheme_policy.cpp
          components/wfrac_device_model/src/protocol_mapping.cpp
          components/wfrac_device_model/src/device_state.cpp
          components/wfrac_device_model/src/protocol_command_mapping.cpp
          components/wfrac_device_model/src/protocol_request_mapping.cpp
          components/wfrac_device_model/src/protocol_observation.cpp
          components/wfrac_client/src/request_executor.cpp
          components/wfrac_client/src/control_verification.cpp
          components/wfrac_client/src/runtime_orchestrator.cpp
          tests/host_cpp/test_runtime_orchestrator.cpp
          -o runtime-orchestration-tests && ./runtime-orchestration-tests
